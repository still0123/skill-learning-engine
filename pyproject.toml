[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skill-learning-engine"
version = "0.1.0"
description = "Experience-driven skill learning with persistent knowledge, evaluation gates, and rollback."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Skill Learning Engine contributors" }]
keywords = ["llm", "agent", "skill", "skill-learning", "evaluation"]
dependencies = [
  "agentloop @ git+https://github.com/still0123/agentloop.git@f8a040529822dcced2628fb87f04d7dbc3bb305f",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
skill-learning = "skill_learning.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["skill_learning"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
